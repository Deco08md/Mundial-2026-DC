<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--surf:#1c1c1e;--card:#2c2c2e;--card2:#3a3a3c;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.06);
  --text:#ffffff;--text2:rgba(235,235,245,0.8);--text3:rgba(235,235,245,0.5);
  --green:#30d158;--green-d:rgba(48,209,88,0.18);--green-t:rgba(48,209,88,0.08);
  --gold:#ffd60a;--gold-d:rgba(255,214,10,0.18);--gold-t:rgba(255,214,10,0.06);
  --blue:#0a84ff;--blue-d:rgba(10,132,255,0.18);
  --red:#ff453a;--red-d:rgba(255,69,58,0.18);
  --orange:#ff9f0a;
  --nav-h:64px;--top-h:56px;
}
html{background:var(--bg);color:var(--text);font-family:'Barlow',-apple-system,sans-serif;font-size:16px}
body{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
button{font-family:'Barlow',-apple-system,sans-serif;cursor:pointer;border:none;background:none;color:var(--text)}
input{font-family:'Barlow',-apple-system,sans-serif;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--green)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* Layout */
.topbar{position:fixed;top:0;left:0;right:0;max-width:480px;margin:0 auto;height:var(--top-h);background:rgba(15,15,15,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border2);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.topbar-left{display:flex;flex-direction:column}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.topbar-sub{font-size:11px;color:var(--text3)}
.refresh-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text2)}
.main{padding-top:calc(var(--top-h) + 8px);padding-bottom:calc(var(--nav-h) + 16px)}
.sec{display:none;padding:12px 14px}
.sec.on{display:block}

/* Bottom nav */
.botnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;height:var(--nav-h);background:rgba(15,15,15,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid var(--border2);display:flex;align-items:stretch;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;font-size:10px;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;font-family:'Barlow',-apple-system,sans-serif;transition:color .15s}
.nb i{font-size:22px;display:block}
.nb.on{color:var(--green)}
.nb.pan{color:var(--gold)}
.nb.pan.on{color:var(--gold)}

/* Cards */
.mc{background:var(--surf);border:0.5px solid var(--border2);border-radius:16px;padding:12px 14px;margin-bottom:9px}
.mc.pan{border-color:rgba(255,214,10,.35);border-width:1px}
.mc.live-card{border-color:rgba(48,209,88,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:11px;color:var(--text3)}
.mt{display:flex;align-items:center;gap:7px}
.tn{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;line-height:1.2}
.tn.r{text-align:right}
.ms{display:flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;min-width:56px;justify-content:center}
.sn{min-width:24px;text-align:center}
.ss{color:var(--text3);font-size:14px}
.mven{font-size:10px;color:var(--text3);margin-top:6px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:500}
.blive{background:var(--green-d);color:var(--green)}
.bfin{background:var(--card2);color:var(--text3)}
.bup{background:var(--blue-d);color:var(--blue)}

/* Section title */
.stit{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:.3px}
.sdate{font-size:12px;font-weight:500;color:var(--text3);margin:14px 0 7px;text-transform:capitalize}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:100px;font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--text3);background:none;cursor:pointer;font-family:'Barlow',-apple-system,sans-serif}
.chip.on{background:var(--green-d);color:var(--green);border-color:rgba(48,209,88,.3)}
.chip.pan-chip.on{background:var(--gold-d);color:var(--gold);border-color:rgba(255,214,10,.3)}

/* Group tables */
.gc{background:var(--surf);border:0.5px solid var(--border2);border-radius:16px;margin-bottom:12px;overflow:hidden}
.gh{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:8px 14px;background:var(--card);color:var(--text2);letter-spacing:.7px}
.st{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.st th{padding:6px 7px;font-size:10px;color:var(--text3);text-align:center;border-bottom:0.5px solid var(--border2);font-weight:500}
.st th:first-child{text-align:left}
.st td{padding:8px 7px;text-align:center;border-bottom:0.5px solid var(--border2)}
.st td:first-child{text-align:left}
.st tr:last-child td{border-bottom:none}
.qr td{background:rgba(48,209,88,.05)}
.tr td{background:rgba(10,132,255,.05)}
.pb{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:3px}
.pf{height:100%;border-radius:2px;background:var(--green)}
.pfb{background:var(--blue)}

/* Player cards */
.pc{background:var(--surf);border:0.5px solid var(--border2);border-radius:14px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.pnum{width:32px;height:32px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--text3);flex-shrink:0}
.pn{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600}
.pm{font-size:11px;color:var(--text3);margin-top:1px}
.ps{text-align:right;font-size:10px;color:var(--text3);max-width:90px}

/* Info rows */
.ir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border2);font-size:13px;gap:12px}
.ir:last-child{border-bottom:none}
.il{color:var(--text3);flex-shrink:0}

/* Stats */
.stat-card{background:var(--surf);border-radius:14px;padding:12px;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px}

/* Team grid */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.tcard{background:var(--surf);border:0.5px solid var(--border2);border-radius:14px;padding:13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;transition:background .1s}
.tcard:active{background:var(--card)}

/* Prediction inputs */
.psi{width:44px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;padding:7px 4px;border-radius:10px}

/* Panama hero */
.pan-hero{background:linear-gradient(135deg,rgba(255,214,10,.1),rgba(255,159,10,.05));border:1px solid rgba(255,214,10,.2);border-radius:18px;padding:16px;margin-bottom:14px;text-align:center}

/* Promo box */
.pbox{background:var(--surf);border:0.5px solid var(--border2);border-radius:16px;padding:13px;margin-bottom:10px}
.pbox-title{font-size:13px;font-weight:500;margin-bottom:8px}

/* Back button */
.back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--blue);margin-bottom:14px;background:none;border:none;cursor:pointer;padding:0}

/* Empty state */
.empty{text-align:center;padding:32px 20px;color:var(--text3);font-size:13px}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:.5}

/* Loading */
.load{text-align:center;padding:32px;color:var(--text3);font-size:13px}

/* Scrollable top nav for small overflows */
::-webkit-scrollbar{display:none}

/* Divider */
.divider{height:0.5px;background:var(--border2);margin:10px 0}

/* Share result */
.share-ok{background:var(--green-d);color:var(--green);padding:10px;border-radius:12px;font-size:13px;text-align:center;margin-top:8px}

/* Spinning animation for refresh */
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .7s linear infinite}

/* Countdown */
.countdown{background:var(--card);border-radius:14px;padding:12px;text-align:center;margin-top:10px}
.cval{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--gold)}
.clbl{font-size:10px;color:var(--text3);margin-top:2px}

/* Prob rows */
.prob-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.prob-lbl{flex:0 0 140px;color:var(--text2)}
.prob-pct{flex:0 0 42px;text-align:right;font-weight:500;font-size:13px}
.prob-bar{flex:1}

/* Toast */
#toast{position:fixed;bottom:calc(var(--nav-h)+12px);left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 18px;border-radius:100px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:200;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

function go(id,btnId){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  const btn=document.getElementById(btnId);
  if(btn)btn.classList.add('on');
  curSec=id;
  draw(id);
}

function f(t){return FLAGS[t]||'🏳'}
function elo(t){return ELO[t]||1500}

function toPA(d,t){
  try{
    const dt=new Date(d+'T'+(t||'00:00')+':00Z');
    return dt.toLocaleString('es-PA',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  }catch(e){return d}
}

function todayPA(){return new Date().toLocaleDateString('en-CA',{timeZone:TZ})}

function isLiveStatus(s){return s==='live'||s==='in'||s==='status_in_progress'||s==='STATUS_IN_PROGRESS';}
function isFinalStatus(s){return s==='final'||s==='post'||s==='status_final'||s==='STATUS_FINAL'||s==='status_full_time'||s==='STATUS_FULL_TIME';}
function badge(m){
  const s=m.status||'';
  if(isLiveStatus(s))
    return`<span class="badge blive"><span style="display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:2px;"></span>En vivo ${m.clock||''}</span>`;
  if(isFinalStatus(s))
    return`<span class="badge bfin">Final</span>`;
  return`<span class="badge bup">${toPA(m.date||'',m.tUTC||m.timeUTC||'')}</span>`;
}

function mcard(m){
  const isPan=(m.home||m.homeTeam)==='Panama'||(m.away||m.awayTeam)==='Panama';
  const isLive=(m.status==='live'||m.status==='in'||m.status==='STATUS_IN_PROGRESS');
  const ht=m.home||m.homeTeam||'?', at=m.away||m.awayTeam||'?';
  const hs=m.hs!=null?m.hs:(m.homeScore!=null?m.homeScore:null);
  const as2=m.as!=null?m.as:(m.awayScore!=null?m.awayScore:null);
  const scoreHtml=hs!=null
    ?`<div class="ms"><span class="sn">${hs}</span><span class="ss">-</span><span class="sn">${as2}</span></div>`
    :`<div class="ms"><span class="ss" style="font-size:13px;">vs</span></div>`;
  return`<div class="mc${isPan?' pan':''}${isLive?' live-card':''}">
    <div class="mh"><span>${m.group||m.round||'Copa del Mundo'}</span>${badge(m)}</div>
    <div class="mt">
      <span style="font-size:20px;">${f(ht)}</span>
      <span class="tn">${ht}</span>
      ${scoreHtml}
      <span class="tn r">${at}</span>
      <span style="font-size:20px;">${f(at)}</span>
    </div>
    ${m.venue?`<div class="mven"><i class="ti ti-map-pin" style="font-size:10px;" aria-hidden="true"></i> ${m.venue}</div>`:''}
  </div>`;
}

function qProb(team,gTeams){
  const r=elo(team), avg=gTeams.filter(t=>t!==team).reduce((a,t)=>a+elo(t),0)/3;
  return Math.min(95,Math.max(5,Math.round(50+(r-avg)/400*60)));
}
function winProb(team){
  const r=elo(team)*elo(team), tot=Object.values(ELO).reduce((a,x)=>a+x*x,0);
  return Math.round(r/tot*1000)/10;
}

function calcGroup(teams){
  const s={};
  teams.forEach(t=>{s[t]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});
  matches.forEach(m=>{
    const ht=m.home||m.homeTeam, at=m.away||m.awayTeam;
    if(!s[ht]||!s[at])return;
    const hs=m.hs!=null?m.hs:m.homeScore, as2=m.as!=null?m.as:m.awayScore;
    if(hs==null||as2==null)return;
    s[ht].p++;s[at].p++;s[ht].gf+=hs;s[ht].ga+=as2;s[at].gf+=as2;s[at].ga+=hs;
    if(hs>as2){s[ht].w++;s[ht].pts+=3;s[at].l++;}
    else if(hs<as2){s[at].w++;s[at].pts+=3;s[ht].l++;}
    else{s[ht].d++;s[ht].pts++;s[at].d++;s[at].pts++;}
  });
  return Object.values(s).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

function drawHome(){
  const el=document.getElementById('home');
  const today=todayPA();
  const live=matches.filter(m=>isLiveStatus(m.status||''));
  const tod=matches.filter(m=>m.date===today);
  const recent=matches.filter(m=>isFinalStatus(m.status||'')).slice(-6);
  const upcoming=matches.filter(m=>m.date>today&&!isFinalStatus(m.status||'')&&!isLiveStatus(m.status||'')).slice(0,5);
  let h='';

function drawPreds(){
  const el=document.getElementById('preds');
  const hash=window.location.hash.slice(1);
  let shared=null, sharedName=null;
  if(hash){try{const d=JSON.parse(atob(hash));shared=d.preds;sharedName=d.name;}catch(e){}}
  const upcoming=matches.filter(m=>!isFinalStatus(m.status||'')&&!isLiveStatus(m.status||'')).slice(0,10);
  const done=matches.filter(m=>isFinalStatus(m.status||''));
  let h='';
  if(shared&&sharedName){
    h+=`<div style="background:var(--blue-d);border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--blue);display:flex;align-items:center;gap:8px;"><i class="ti ti-share" style="font-size:16px;" aria-hidden="true"></i><span>Predicciones de <strong>${sharedName}</strong> compartidas contigo</span></div>`;
  }
  h+=`<div class="pbox">
    <label style="font-size:11px;color:var(--text3);display:block;margin-bottom:6px;">Tu nombre (para compartir predicciones)</label>
    <input id="pn" type="text" placeholder="Escribe tu nombre aquí" value="${myName}" oninput="myName=this.value;localStorage.setItem('wc26n',myName);" style="width:100%;" />
  </div>`;
  if(shared&&done.length){
    let me=0,them=0;
    done.forEach(m=>{
      const k=m.id||m.home+m.away+m.date;
      const hs=m.hs!=null?m.hs:m.homeScore, as2=m.as!=null?m.as:m.awayScore;
      const win=hs>as2?'h':hs<as2?'a':'d';
      const mp=myPreds[k];if(mp){const mw=mp.h>mp.a?'h':mp.h<mp.a?'a':'d';if(mw===win)me++;}
      const sp=shared[k];if(sp){const sw=sp.h>sp.a?'h':sp.h<sp.a?'a':'d';if(sw===win)them++;}
    });
    h+=`<div class="pbox" style="margin-bottom:14px;">
      <div class="pbox-title">🏆 Marcador familiar</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px;">
        <div class="stat-card"><div class="stat-val" style="color:var(--green);">${me}</div><div class="stat-lbl">${myName||'Tú'} · aciertos</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--blue);">${them}</div><div class="stat-lbl">${sharedName} · aciertos</div></div>
      </div>
    </div>`;
  }
  if(upcoming.length){
    h+=`<div class="stit" style="margin-bottom:10px;">Tus predicciones</div>`;
    upcoming.forEach(m=>{
      const k=m.id||m.home+m.away+m.date;
      const mp=myPreds[k]||{h:'',a:''};
      const sp=shared?shared[k]:null;
      const ht=m.home||m.homeTeam, at=m.away||m.awayTeam;
      h+=`<div class="mc" style="margin-bottom:9px;">
        <div class="mh"><span>${m.group||m.round||''}</span><span style="font-size:10px;color:var(--text3);">${toPA(m.date||'',m.tUTC||m.timeUTC||'')}</span></div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:19px;">${f(ht)}</span>
          <span style="flex:1;font-size:13px;font-weight:500;">${ht}</span>
          <input class="psi" type="number" min="0" max="20" placeholder="-" value="${mp.h}" oninput="sp2('${k}','h',this.value)" />
          <span style="color:var(--text3);">-</span>
          <input class="psi" type="number" min="0" max="20" placeholder="-" value="${mp.a}" oninput="sp2('${k}','a',this.value)" />
          <span style="flex:1;font-size:13px;font-weight:500;text-align:right;">${at}</span>
          <span style="font-size:19px;">${f(at)}</span>
        </div>
        ${sp?`<div style="font-size:10px;color:var(--text3);text-align:center;margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border2);"><i class="ti ti-user" style="font-size:10px;" aria-hidden="true"></i> ${sharedName} predice: ${sp.h} - ${sp.a}</div>`:''}
      </div>`;
    });
  } else {
    h+=`<div class="empty"><i class="ti ti-target" aria-hidden="true"></i>Aún no hay partidos disponibles para predecir</div>`;
  }
  h+=`<div style="margin-top:16px;">
    <button onclick="sharePreds()" style="width:100%;padding:13px;background:var(--green-d);border-radius:14px;color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;">
      <i class="ti ti-share" style="font-size:18px;" aria-hidden="true"></i> Compartir con la familia
    </button>
    <div id="surl" style="display:none;margin-top:9px;"></div>
  </div>`;
  el.innerHTML=h;
}

function sp2(k,side,v){
  if(!myPreds[k])myPreds[k]={h:'',a:''};
  myPreds[k][side]=v;
  localStorage.setItem('wc26p',JSON.stringify(myPreds));
}

function startCountdown(){

      el.innerHTML=`<div style="text-align:center;padding:10px;font-size:15px;font-weight:600;color:var(--green);">¡El partido ya comenzó! 🎉</div>`;

    }
    const d=Math.floor(diff/86400000), hr=Math.floor((diff%86400000)/3600000), mn=Math.floor((diff%3600000)/60000), sc=Math.floor((diff%60000)/1000);

    </div>`;
  }
  tick();
  cdInterval=setInterval(tick,1000);
}

    <div class="ir"><span class="il"><i class="ti ti-language" style="font-size:12px;" aria-hidden="true"></i> Idioma</span><span>Inglés y francés · hay comunidad latina</span></div>
    <div class="ir"><span class="il"><i class="ti ti-first-aid-kit" style="font-size:12px;" aria-hidden="true"></i> Emergencias</span><span>911</span></div>
    <div class="ir"><span class="il"><i class="ti ti-camera" style="font-size:12px;" aria-hidden="true"></i> Fotos</span><span>Permitidas · sin trípodes ni drones</span></div>
  </div>`;

  h+=`<div class="stit" style="margin-bottom:10px;">Partidos de Panamá</div>${ms.map(mcard).join('')}`;
  h+=`<div class="stit" style="margin-bottom:10px;margin-top:16px;">La convocatoria</div>`;
  SQUADS['Panama'].squad.forEach(p=>{
    h+=`<div class="pc">
      <div class="pnum">${p.num}</div>
      <div style="flex:1"><div class="pn">${p.name}</div><div class="pm">${p.pos} · ${p.age} años · ${p.club}</div></div>
      <div class="ps">${p.stat}</div>
    </div>`;
  });
  h+=`<div style="background:var(--surf);border:0.5px solid var(--border2);border-radius:16px;padding:13px;margin-top:14px;margin-bottom:24px;">
    <div style="font-size:13px;font-weight:500;margin-bottom:10px;">Historia mundialista de Panamá</div>
    <div class="ir"><span class="il">Primera Copa del Mundo</span><span>Rusia 2018</span></div>
    <div class="ir"><span class="il">Mejor resultado</span><span>Fase de grupos</span></div>
    <div class="ir"><span class="il">Copas jugadas</span><span>2 (2018, 2026)</span></div>
    <div class="ir"><span class="il">Clasificación FIFA</span><span>Top 75 mundial</span></div>
  </div>`;
  el.innerHTML=h;
  startCountdown();
}

function draw(id){
  if(id==='home')drawHome();
  else if(id==='sched')drawSched();
  else if(id==='grps')drawGroups();
  else if(id==='kout')drawKnockout();
  else if(id==='teams')drawTeams();
  else if(id==='preds')drawPreds();
  else if(id==='pan')drawPanama();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function processEvent(ev){
  try{
    const c=ev.competitions[0];
    const ho=c.competitors.find(x=>x.homeAway==='home');
    const aw=c.competitors.find(x=>x.homeAway==='away');
    const st=c.status.type.name;
    const hs=ho?.score!=null&&ho.score!==''?parseInt(ho.score):null;
    const as2=aw?.score!=null&&aw.score!==''?parseInt(aw.score):null;
    return{
      id:ev.id,
      date:ev.date.split('T')[0],
      tUTC:ev.date.split('T')[1]?.substring(0,5),
      home:normName(ho?.team.displayName||ho?.team.name||''),
      away:normName(aw?.team.displayName||aw?.team.name||''),
      hs:isFinalStatus(st)||isLiveStatus(st)?hs:null,
      as:isFinalStatus(st)||isLiveStatus(st)?as2:null,
      status:st,clock:c.status.displayClock,
      venue:c.venue?.fullName,
      group:c.notes?.[0]?.headline||c.groups?.[0]?.name||'',
      round:ev.seasonType?.name,
    };
  }catch(e){return null;}
}

async function fetchHistory(force=false){
  const key='wc26hist',tsKey='wc26hist_ts';
  if(!force){
    const ts=localStorage.getItem(tsKey);
    if(ts&&Date.now()-parseInt(ts)<3600000){
      const cached=localStorage.getItem(key);
      if(cached)return JSON.parse(cached);
    }
  }
  const start=new Date('2026-06-11T00:00:00Z');
  const today=new Date();
  const dates=[];
  for(let d=new Date(start);d<today;d.setUTCDate(d.getUTCDate()+1)){
    dates.push(d.toISOString().slice(0,10).replace(/-/g,''));
  }
  if(!dates.length)return[];
  try{
    const results=await Promise.all(
      dates.map(d=>
        fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${d}`)
          .then(r=>r.json())
          .then(data=>(data.events||[]).map(processEvent).filter(Boolean))
          .catch(()=>[])
      )
    );
    const all=results.flat().filter(Boolean);
    if(all.length){
      localStorage.setItem(key,JSON.stringify(all));
      localStorage.setItem(tsKey,Date.now().toString());
    }
    return all;
  }catch(e){
    const cached=localStorage.getItem(key);
    return cached?JSON.parse(cached):[];
  }
}

async function fetchAll(manual=false){
  const ri=document.getElementById('ri');
  if(ri)ri.classList.add('spinning');
  if(manual){
    localStorage.removeItem('wc26hist_ts');
    localStorage.removeItem('wc26mt');
  }
  try{
    // Fetch today's live matches + full history in parallel
    const [todayResp, history]=await Promise.all([
      fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard').then(r=>r.json()),
      fetchHistory(manual),
    ]);
    const todayMatches=(todayResp.events||[]).map(processEvent).filter(Boolean);
    // Merge: today > history > FALLBACK (deduplicate by id AND by home+away+date)
    const seenId=new Set(), seenGame=new Set();
    const merged=[];
    for(const m of [...todayMatches,...history,...FALLBACK]){
      const gameKey=(m.home||'')+'|'+(m.away||'')+'|'+(m.date||'');
      if(!seenId.has(m.id)&&!seenGame.has(gameKey)){
        seenId.add(m.id);seenGame.add(gameKey);merged.push(m);
      }
    }
    merged.sort((a,b)=>a.date.localeCompare(b.date)||(a.tUTC||'').localeCompare(b.tUTC||''));
    matches=merged;
    localStorage.setItem('wc26m',JSON.stringify(matches));
    localStorage.setItem('wc26mt',Date.now().toString());
    if(manual)toast('Datos actualizados ✓');
  }catch(e){
    const cached=localStorage.getItem('wc26m');
    const ts=localStorage.getItem('wc26mt');
    if(cached&&ts&&Date.now()-parseInt(ts)<7200000){
      matches=JSON.parse(cached);
      if(manual)toast('Sin conexión — datos guardados');
    }else{
      matches=FALLBACK;
      if(manual)toast('Sin conexión — datos de respaldo');
    }
  }
  if(ri)ri.classList.remove('spinning');
  draw(curSec);
}

matches=FALLBACK;
draw('home');
draw('pan');
fetchAll();
setInterval(()=>fetchAll(),60000);
</script>
